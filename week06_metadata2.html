## Controlled vocabulary

A **controlled vocabulary** is a deliberately managed set of terms used consistently to represent concepts or entities.

It helps address:

- synonyms
- variant names
- spelling / word-form variation
- ambiguity
- inconsistent terminology

---

## Preferred and variant terms

A vocabulary may establish a **preferred term** while recording other forms as variants.

For example:

**Preferred:** `automobiles`  
**Variant:** `cars`

Users may search in different ways; the metadata can still be normalized.

---

## Authority control

Related problem, especially for **named entities**:

- people
- organizations
- places

One entity may have:

- multiple names
- changed names
- different spellings
- identical names shared by different entities

Authority control connects those variants to an identified entity.

---

## Getty vocabularies

### [AAT — Art & Architecture Thesaurus](https://www.getty.edu/research/tools/vocabularies/aat/)
Concepts: object/work types, materials, processes, styles, and more

### [TGN — Thesaurus of Geographic Names](https://www.getty.edu/research/tools/vocabularies/tgn/)
Places, names, geographic hierarchy

### [ULAN — Union List of Artist Names](https://www.getty.edu/research/tools/vocabularies/ulan/)
People and corporate bodies; name variants and identity information

## Established or local?

### Established vocabulary

Useful when:

- it covers your domain well
- interoperability matters
- stable identifiers / maintained terms help

### Local vocabulary

Useful when:

- your collection has specialized concepts
- you need a small finite set of project categories
- local distinctions matter

**Local does not have to mean uncontrolled.**

---

## Not every field needs a vocabulary

Would you use a controlled vocabulary for:

- subject?
- creator?
- type?
- date?
- description?
- identifier?

Different fields need different kinds of rules.

---

## Three ways to control values

1. **Controlled vocabulary**  
   Which terms/values may I choose?

2. **Encoding scheme / value standard**  
   In what standardized form should I represent the value?

3. **Content guideline**  
   What should I record, and how should I formulate it?

---

## 1. Controlled vocabulary

### Which terms/values may I choose?

Examples:

- subjects from an approved list
- object types from AAT
- places identified through TGN
- a local vocabulary of collection categories

The goal is **consistent choice of terms**.

---

## 2. Encoding scheme / value standard

### How should this kind of value be represented?

Examples:

- date: `1965-09-13`
- language: a consistent language-code scheme
- coordinates: a defined numeric representation

The goal is **predictable representation**.

---

## 3. Content guideline

### What should I record, and how?

**Title:**  
“Transcribe a supplied title exactly. If no title is supplied, devise a concise descriptive title.”

**Creator:**  
“Record the person or organization primarily responsible for the intellectual or artistic content. Do not record donors here.”

---

## Content guideline: another example

### Description

“Write 1–3 sentences describing visually or intellectually significant content not already evident from the title.”

A content guideline is not necessarily a list of allowed words.

It is an **instruction to the metadata creator**.

---

## A field can use several rules

### `date`

**Content guideline:** record date of creation, not digitization  
**Encoding rule:** use `YYYY-MM-DD` when a full date is known

### `subject`

**Controlled vocabulary:** approved subject terms  
**Content guideline:** assign 2–6 significant topics

## How much control?

| Field | Likely approach |
| --- | --- |
| Subject | Vocabulary + guideline |
| Date | Encoding rule + guideline |
| Description | Free text + guideline |
| Type | Small controlled vocabulary |
| Creator | Authority control when practical + guideline |
| Identifier | Local/system rule |

**More control is not automatically better.**

---

## Metadata Application Profile

A **MAP** documents how a particular project or community uses metadata.

It turns a general schema/element set into **local operational rules**.

> A MAP is not just a list of columns.

---

## What does a MAP specify?

| Component | Question |
| --- | --- |
| Element / field | What information? |
| Definition | What exactly does it mean here? |
| Obligation | Required / recommended / optional? |
| Cardinality | One or multiple? |
| Controlled vocabulary | Approved values? |
| Encoding/value standard | Standard representation? |
| Content guideline | Instructions for entry? |
| Example | What does a valid value look like? |

---

## Sample MAP row: `date`

<div class="small">

| Component | Rule |
| --- | --- |
| Definition | Date original resource was created/published—not digitization date |
| Obligation | Recommended |
| Cardinality | One |
| Vocabulary | None |
| Encoding | `YYYY`, `YYYY-MM`, or `YYYY-MM-DD` |
| Guideline | Use most specific known date; do not invent missing month/day |
| Example | `1965-09-13` |

</div>

---

## Sample MAP row: `subject`

<div class="small">

| Component | Rule |
| --- | --- |
| Definition | Topics, people, places, or concepts substantially represented |
| Obligation | Recommended |
| Cardinality | Multiple |
| Vocabulary | Project vocabulary and/or named external vocabulary |
| Encoding | None unless identifiers/URIs are specified |
| Guideline | Assign 2–6 specific, significant terms |
| Example | `Indiana Memorial Union; Students` |

</div>

---

## Why write all this down?

Imagine you hand your CSV to a new project assistant.

They see a column called:

`date`

What do they still need to know?

---

## `date` is not self-documenting

- Date of what?
- Is it required?
- Can there be more than one?
- How precise must it be?
- What if only the year is known?
- What if the date is uncertain?
- What format should be used?

A field name is only the beginning.

---

## CollectionBuilder metadata

Think about two kinds of fields:

### Descriptive / intellectual

`title` · `creator` · `date` · `subject` · `description`

### Project / functional

Fields used by your CollectionBuilder implementation to identify, connect, locate, display, or process objects

Both need documentation—but they serve different purposes.

---

## A useful question

For every field in your project:

> Is this field here because it **describes the resource**, because the **system needs it**, or both?

Your MAP should document the fields your actual collection needs.

## Start your MAP

### Individual work — about 18 minutes

Draft **at least five substantive rows**:

- title/name
- date, if relevant
- subject/topic, if relevant
- a field especially important to your collection
- a CollectionBuilder/project-functional field

---
<!-- .slide: class="activity" -->

## For each field, decide

1. Field name
2. Definition
3. Obligation
4. Cardinality
5. Controlled vocabulary / value standard, if any
6. Content guideline
7. Example

### Test

Could another person create a valid value **without asking you what you meant**?

---

## Watch for these problems

- “Creator = the creator”
- everything is **Required**
- single-value fields that obviously need repetition
- “controlled vocabulary” with no actual vocabulary
- vague rules: “Enter the date correctly”
- examples that violate the stated rule
- forgetting project/system fields

---

## The Week 7 test

> Could another person use your application profile to create consistent metadata for your collection without having to ask you what you meant?

Choose **one field** from your project.

What does it need?

- encoding/value standard?
- content guideline?
