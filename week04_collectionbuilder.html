## What is CollectionBuilder?
### <!-- 9:20–9:35 -->

CollectionBuilder is an **open-source framework for creating digital collection and exhibit websites**.

For our purposes, its important characteristics are:

- static-web methodology;
- repository-based rather than database/CMS-based architecture;
- structured collection data;
- configuration that remains visible and editable;
- digital objects connected to descriptive records;
- a public interface generated from those components.

Resource: [CollectionBuilder](https://collectionbuilder.github.io/)

---
## Four ways to think about the project

<div class="columns small">
<div>

### Data

- CSV metadata
- structured values describing collection objects

### Content

- images
- PDFs/documents
- audio/video
- contextual or interpretive content

</div>
<div>

### Configuration

- collection identity
- navigation
- metadata-field configuration
- display behavior

### Presentation

- templates/layouts
- CSS
- generated interface elements

</div>
</div>

The boundaries can be fuzzy. The categories give us a useful **conceptual model**.

## Anatomy of a CollectionBuilder repository
### <!-- 9:35–9:55 -->

```text
repository
│
├── _config.yml
├── _data/
│   └── metadata.csv
├── objects/
├── pages/
├── _includes/
├── _layouts/
└── assets/
```

Today we care more about **what these pieces do** than about understanding every file.

---
## What do the pieces do?

| Component | Basic role |
|---|---|
| `_data/metadata.csv` | Describes collection items |
| `objects/` | Contains or connects to digital objects |
| `_config.yml` | Basic site/collection configuration |
| `pages/` | Content/navigation pages |
| `_layouts/` / `_includes/` | Instructions for constructing pages |
| `assets/` | CSS, JavaScript, images, etc. |

> We are learning to **use CollectionBuilder**, not to develop CollectionBuilder itself.

## Metadata → object → interface
### <!-- 9:55–10:10 -->

A CSV gives us a simple structured model:

```text
one row    = one item
one column = one field
one cell   = one value
```

A metadata record might contain:

```text
objectid: obj001
title: ...
creator: ...
date: ...
subject: ...
```

CollectionBuilder uses those structured values to construct and organize the interface.

## `objectid`: more than description

Each item needs a **unique identifier**.

In CollectionBuilder, `objectid` helps connect:

- a metadata record;
- its digital object; and
- other parts of the generated collection.

> `objectid` is not merely descriptive metadata. It performs a **functional role** in connecting the record to the object.

## Next: configuring the collection

### A little YAML

Configuration files require exact syntax.

This works:

```yaml
title: My Digital Collection
```

This does not:

```yaml
title My Digital Collection
```

Indentation and punctuation can matter too.

You do not need to become a YAML expert today—but when something breaks, **syntax is one place to look**.

## Website or digital library?

> **What makes this a digital library rather than just a website containing some pictures?**

Consider:

- structured description;
- relationships among objects and metadata;
- discovery;
- organization;
- contextualization;
- consistent presentation;
- collection-level structure.

---
## What doesn't CollectionBuilder automatically solve?

A functioning CollectionBuilder site does not by itself solve every digital-library problem:

- preservation;
- authority control;
- persistent identifiers;
- rights management;
- long-term stewardship;
- metadata quality;
- interoperability.

We will return to several of these issues later in the semester.
