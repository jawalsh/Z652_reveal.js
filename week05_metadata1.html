## Learning objectives

By the end of class, you should be able to:

- Define metadata and explain several purposes it serves.
- Distinguish descriptive, administrative, structural, and technical metadata.
- Identify metadata **records, elements/fields, and values**.
- Explain the purpose of a metadata schema or element set.
- Identify appropriate **Dublin Core** elements for common digital objects.
- Explain **obligation** and **cardinality/repeatability**.
- Explain at a basic level what a **metadata application profile (MAP)** does.
- Connect Dublin Core concepts to CollectionBuilder metadata.

## What is metadata?
### <!-- 9:20–9:40 -->

A useful starting point:

> **Metadata is structured information about a resource.**

But that raises questions:

- What information?
- About what kind of resource?
- Structured how?
- Structured for whom—or for what system?
- For what purposes?

---
<!-- .slide: class="activity small" -->
## What does metadata do?
### Whole class

Think about a digital collection you have used.

What does its metadata allow you—or the system—to do?

Possible starting points:

- identify
- find
- distinguish
- select
- access
- organize
- manage
- preserve
- relate

Can one metadata value serve more than one purpose?

---
## Types of metadata

<div class="columns small">
<div>

### Descriptive

Helps identify, discover, and understand a resource.

- title
- creator
- subject
- description

### Structural

Describes relationships among parts.

- page sequence
- chapters
- files belonging to one object

</div>
<div>

### Administrative

Supports management of a resource.

- rights information
- acquisition information
- digitization information

### Technical

Describes technical characteristics.

- file format
- dimensions
- resolution
- file size

</div>
</div>

## From information to schemas
### <!-- 9:40–9:55 -->

Suppose every digital collection simply invents its own fields:

```text
writer
author
creator
made_by
responsible_person
```

All might mean roughly the same thing.

What problems could this create?

---
## Metadata schemas and element sets

A metadata schema or element set provides a defined set of elements for describing resources.

It can help establish:

- shared names for elements;
- shared definitions;
- greater consistency;
- documentation;
- exchange and reuse of metadata.

But a standard does **not** make every local decision for us.

---
## Dublin Core

**Dublin Core** is a general-purpose metadata element set designed to describe a wide variety of resources.

Today we concentrate on the original **15 elements** in the Dublin Core Metadata Element Set.

You do **not** need to memorize them.

Resource: [Dublin Core Metadata Element Set, Version 1.1](https://www.dublincore.org/specifications/dublin-core/dces/)

---
## The 15 Dublin Core elements
### <!-- 9:55–10:15 -->

<div class="columns small">
<div>

- Contributor
- Coverage
- Creator
- Date
- Description
- Format
- Identifier
- Language

</div>
<div>

- Publisher
- Relation
- Rights
- Source
- Subject
- Title
- Type

</div>
</div>

> Think of these as **broad semantic buckets**, not a complete set of instructions for creating metadata.

---
## Similar—but not the same

<div class="columns small">
<div>

### Creator / Contributor
Who is primarily responsible? Who else contributed?

### Type / Format
What kind of resource is it? What physical or digital form does it take?

### Publisher / Creator
Who made the intellectual content? Who made it available?

</div>
<div>

### Source / Relation
Is this derived from another resource? How is it related to other resources?

### Coverage / Subject
Is a place or time the scope of the resource, or is it what the resource is about?

### Identifier / Source
How do we identify this resource versus the resource from which it derives?

</div>
</div>

## Dublin Core isn't enough
### <!-- 10:40–10:55 -->

Suppose our collection uses these elements:

```text
Title
Creator
Date
Description
Subject
```

We still have decisions to make.

For example:

> Must every record have a creator?

That is a question of **obligation**.

---
## Obligation

An application can specify whether an element is:

- **required** — a value must be supplied;
- **recommended** — supply a value when appropriate/available;
- **optional** — a value may be supplied.

The exact labels and rules can vary.

The important question is:

> **What must a metadata creator do for this collection?**

---
<!-- .slide: class="activity" -->
## What should be required?
### Whole class

For our sample collection, consider:

```text
Title
Creator
Date
Description
Subject
Rights
Identifier
```

Which should be:

**REQUIRED | RECOMMENDED | OPTIONAL**

What happens when information is unknown?

---
## Another unanswered question
### <!-- 10:55–11:10 -->

Suppose we decide to use `Creator`.

How many creators can an item have?

```text
Creator: Jack Kirby
```

What about:

```text
Creator: Jack Kirby
Creator: Stan Lee
Creator: Joe Sinnott
```

That is a question of **cardinality**.

---
## Cardinality and repeatability

Cardinality describes how many values an element may—or must—have.

Examples:

```text
exactly one       1
zero or one       0–1
one or more       1–many
zero or more      0–many
```

A **repeatable** element can contain multiple values.

---
<!-- .slide: class="activity" -->
## How many values?
### Whole class

What cardinality might make sense for:

- Title?
- Creator?
- Subject?
- Date?
- Identifier?
- Language?

Would your answer always be the same for every collection?

> Metadata standards provide possibilities; collections establish **local rules**.

## From standard to local practice

Dublin Core might tell us that `Creator` means:

> an entity primarily responsible for making the resource

But our collection still needs to decide things such as:

- Do we use it?
- Is it required?
- Can it repeat?
- What counts as a creator for our materials?
- How should names be entered?

A general standard must be translated into **local practice**.

---
## Metadata application profiles
### <!-- 11:38–11:43 -->

A **metadata application profile (MAP)** documents how a particular collection uses metadata.

A simplified example:

| Field | Definition | Obligation | Cardinality |
|---|---|---|---|
| Title | Name by which the item is known | Required | 1 |
| Creator | Person/organization primarily responsible | Recommended | 0–many |
| Subject | Topics represented by the item | Recommended | 0–many |

This is only part of what your eventual MAP will contain.

---
## Why document the rules?

Imagine three people describing 500 objects.

Without shared rules, they may make different decisions about:

- which fields to use;
- what those fields mean;
- which values are required;
- how many values are allowed;
- how values should be recorded.

> A MAP turns implicit decisions into **explicit documentation**.

---
## Back to CollectionBuilder

Last week we saw fields such as:

```text
objectid
title
creator
date
description
subject
format
identifier
rights
```

Some describe the **intellectual content** of an item.

Others may have a **functional role** in CollectionBuilder.

Your eventual MAP needs to account for both.
