## Markdown: structured plain text
### <!-- 9:35–9:50 -->

Markdown is a lightweight markup language for adding **structure** to plain text.

```markdown
# A heading

This is a paragraph with **bold** and *italic* text.

- one item
- another item

[IU Libraries](https://libraries.indiana.edu/)
```

The source remains readable even before it is rendered.

---
## Plain text versus formatted documents

<div class="columns">
<div>

### Word processor

- Formatting is handled by the application.
- Much of the document structure is hidden.
- File format may be application-specific.
- What you see is close to the final display.

</div>
<div>

### Markdown

- Formatting instructions are visible.
- Structure is explicit in the text.
- Files are simple, portable text.
- Source and rendered display are distinct.

</div>
</div>

---
## Common Markdown

```markdown
# Heading 1
## Heading 2

**bold** and *italic*

- unordered list
- another item

1. ordered item
2. another item

[link text](https://example.org/)

![alt text](image.jpg)
```

Resource: [Markdown Guide: Basic Syntax](https://www.markdownguide.org/basic-syntax/)

## The important idea

You do **not** need to memorize every Markdown feature.

The important conceptual point is:

> **Human-readable plain text can also contain machine-readable instructions about document structure.**

That makes Markdown useful well beyond simple note-taking.

## Git and GitHub: files plus history
### <!-- 9:50–10:05 -->

These terms are related, but they are **not synonyms**.

- **Git** — version-control software
- **Repository** — files plus their recorded history
- **Commit** — a recorded set of changes
- **GitHub** — a hosted platform for Git repositories, collaboration, and publishing

Today we will use GitHub's web interface rather than learning command-line Git.

---
## A repository is more than a folder

A repository contains files **and a history of changes to those files**.

That history can help us answer:

- What changed?
- When did it change?
- Who changed it?
- Why was the change made?
- What did the file look like before?

For a long-lived digital project, those questions can matter a great deal.

---
## A commit is not just “Save”

A useful commit records a meaningful change and gives it a description.

Weak:

> `changes`

Better:

> `Add project description and collection scope`

A commit becomes part of the project's history.

## Live demo: edit and commit
### <!-- within 9:50–10:05 --> Instructor demonstration

In a small GitHub repository:

1. Open a Markdown file.
2. Edit it in GitHub.
3. Preview the change / diff.
4. Write a meaningful commit message.
5. Commit the change.
6. Open the commit history.
7. Compare the previous and current versions.

As you watch: **what does GitHub record that an ordinary Save button does not?**

---
## Why might history matter?

For a digital collection, we may want to trace changes to:

- descriptive text;
- metadata;
- rights statements;
- project documentation;
- configuration;
- interface text;
- data corrections.

Version history can support **accountability, collaboration, recovery, and maintenance**.

---
## From repository to website
### <!-- 10:05–10:20 -->

A browser ultimately receives files such as:

- HTML
- CSS
- JavaScript
- images
- fonts and other assets

But those files do not always have to be authored directly by hand.

A site can be **built** from source files.

---
## Static and dynamic sites

<div class="columns small">
<div>

### Static site

Pages are generated **ahead of time**.

The web server can deliver already-built HTML, CSS, images, and other files.

Source may include Markdown, templates, configuration, and structured data.

</div>
<div>

### Dynamic site

Pages may be assembled **when requested**.

Content may be retrieved from a database and combined with templates or application logic.

Examples include many content-management systems and web applications.

</div>
</div>

Neither architecture is inherently “better.” They solve different problems.

---
## Our conceptual workflow

<div class="workflow">

**Markdown**  
↓  
**GitHub repository**  
↓  
**commit + history**  
↓  
**site-building process**  
↓  
**HTML + CSS + assets**  
↓  
**GitHub Pages**  
↓  
**web browser**

</div>

## GitHub Pages

GitHub Pages is a publishing service that can serve a website associated with a GitHub repository.

For today's purposes, remember:

> **The repository is the project/source; the Pages site is the published result.**

They are related, but they are not the same thing.

Resource: [GitHub Pages documentation](https://docs.github.com/en/pages)

---
## Build time is part of the workflow

A commit does not necessarily appear on the public site instantly.

The publishing system may need to:

1. detect the new commit;
2. run the site-building process;
3. generate updated output;
4. deploy that output; and
5. make it available to browsers.

A delay is not necessarily an error.

## CollectionBuilder preview: putting the pieces together
### <!-- 10:20–10:30 -->

CollectionBuilder brings several of today's ideas together in a digital-collection workflow.

At a high level, a project includes:

- files stored in a repository;
- human-readable configuration/content;
- structured collection data and metadata;
- references to images or other digital objects;
- version history; and
- a static-site build that produces a public collection interface.

Today: **recognition and orientation.**  
Week 4: **working directly with CollectionBuilder.**

## Part 2: Commit and publish
### <!-- 11:05–11:15 -->

1. Review your changes.
2. Write a **descriptive commit message**.
3. Commit the changes.
4. Open the repository's published GitHub Pages site.
5. Locate your rendered page.
6. Verify that the published result matches what you intended.

If it has not appeared yet, ask: **where in the workflow are we?**

<!-- .slide: class="activity" -->
## Troubleshooting questions

If something does not look right, work through the chain:

- Which **file** did you change?
- Did you **preview** it?
- Did you **commit** the change?
- Is the commit visible in the **history**?
- Has the site **rebuilt** yet?
- Are you looking at the **source repository** or the **published site**?
- Is the browser showing an older cached version?

Try to identify the stage before changing things at random.

<!-- .slide: class="activity" -->
## Part 3: Update and observe
### <!-- 11:15–11:25 -->

Make a second, small change:

- correct a sentence;
- add a list item;
- change a heading; or
- replace a link.

Then:

1. Commit it with a **new message**.
2. Inspect the commit history and/or diff.
3. Wait for the site to update.
4. Verify the second change on the published page.

## Collaboration adds another layer

When several people work in the same repository, we may need ways to manage simultaneous or proposed changes.

You may encounter concepts such as:

- conflicting changes;
- branches;
- pull requests; and
- review workflows.

For now, the key idea is simpler: **version control makes changes explicit and traceable.**

---

## The central idea
### <!-- 11:43–11:45 -->

Today's technologies are not isolated skills.

Together, they form part of the infrastructure for building and maintaining digital collections:

> **structured plain text + versioned files + reproducible publishing**
