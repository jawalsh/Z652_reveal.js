## From Week 9 to Week 10

Last week: **What is an image file, and what should we preserve?**

Today: **How do we transform and deliver images without losing control of the originals?**

A preservation master and a web image serve different purposes.

## Opening: choose the right copy — 5 min

A repository holds a 6000 × 4000 TIFF master. Its public site needs a fast-loading image approximately 1200 pixels wide.

- Which file should users download by default?
- What should happen to the TIFF?
- What information should connect the two?

**Pair discussion (3 min), then share (2 min).**

## Image transformations

- **Resize:** change pixel dimensions
- **Crop:** remove part of the image
- **Rotate:** change orientation
- **Convert:** encode in a different file format
- **Compress:** change how image data is stored

A transformation may be reversible in a workflow even when its output loses information: retain the source.

---

## What can go wrong?

- Resizing down removes detail
- Cropping removes context
- Converting to JPEG introduces lossy compression
- Rotating and resaving may trigger recompression
- Incorrect color handling changes appearance

**Always ask:** Which file is the input? Where is the output written?

---

<!-- .slide: class="activity" -->
## Decision exercise — 5 min

For each case, choose a transformation and explain why:

1. A 5000-pixel scan must fit a 1000-pixel-wide page.
2. A postcard scan has empty scanner-bed margins.
3. A TIFF needs a broadly supported browser version.
4. A manuscript scan must remain available for future research.

**Which actions create derivatives? Which require caution?**

## ImageMagick: command-line processing

- Runs image operations from commands or scripts
- Supports inspection, resizing, cropping, conversion
- Useful for repeating the same procedure across many files
- Commands document *what was done*

[ImageMagick documentation](https://imagemagick.org/script/command-line-processing.php)

---

<!-- .slide: class="" -->
## Read a command before running it

```bash
magick identify source.tif
magick source.tif -resize 1200x1200\> access.jpg
```

- `source.tif` = input
- `-resize` = transformation
- `1200x1200>` = fit within the box **only if larger** (quote or escape `>` in a shell)
- `access.jpg` = new output

**Question:** Why should output have a different filename?

---

<!-- .slide: class="activity" -->
## Hands-on: inspect and resize — 12 min

Use one of last week's sample images or a project image. Work with a copy.

```bash
magick identify source.png
magick source.png -resize '1200x1200>' access.jpg
magick identify access.jpg
```

1. Record input and output dimensions.
2. Compare file sizes.
3. Zoom into the two files: what detail changed?

**If ImageMagick is unavailable:** interpret the commands and predict outcomes with a partner.

---

<!-- .slide: class="activity" -->
## Hands-on: convert and compare — 10 min

```bash
magick source.png converted.tif
magick source.png -quality 70 compressed.jpg
magick identify converted.tif compressed.jpg
```

- Which conversion is potentially lossy?
- Does a larger file necessarily contain more detail?
- What should be recorded about these outputs?

**Important:** converting an already lossy file to TIFF does not restore lost information.

## Debrief: one image, several outputs

- Master: retained original or high-quality source
- Access image: fit for ordinary viewing
- Thumbnail: small preview
- Other derivatives: crops, tiles, alternative formats

**Prompt:** Which steps should be standardized for an entire collection?

## Batch processing

For 500 images, repeating a manual operation is slow and inconsistent.

A script can apply the same settings to each source, generate predictable names, and record failures.

**But:** a batch operation can also repeat a mistake 500 times.

---

<!-- .slide: class="" -->
## Example: batch derivatives

```bash
mkdir -p derivatives
for f in masters/*.tif; do
  base=$(basename "$f" .tif)
  magick "$f" -resize '1200x1200>' \
    "derivatives/${base}.jpg"
done
```

**Read it:** What is the input set? What is the output location? Does it overwrite the masters?

*This example assumes TIFF filenames end in `.tif`; real workflows need testing and error handling.*

---

<!-- .slide: class="smaller" -->
## Another example: batch derivatives

```
mkdir -p derivatives/access derivatives/thumb

for f in masters/*.tif; do
  base=$(basename "$f" .tif)

  # Create access image (maximum 1200 pixels)
  magick "$f" -resize '1200x1200>' \
    "derivatives/access/${base}.jpg"

  # Create thumbnail (maximum 200 pixels)
  magick "$f" -resize '200x200>' \
    "derivatives/thumb/${base}.jpg"
done
```

**Read it:** What is the input set? What are the output locations? Does it overwrite the masters?

*This example assumes TIFF filenames end in `.tif`; real workflows need testing and error handling.*

## Why IIIF?

Large, detailed images are difficult to deliver as single downloads.

Institutions want to support:

- Deep zoom and navigation
- Regions and sizes on demand
- Reuse across different websites and tools
- Multiple institutions' objects in one viewing environment

**IIIF = International Image Interoperability Framework.**

---

## Ordinary image delivery vs. IIIF

**Ordinary site:** a webpage links to a prepared JPEG.

**IIIF-based delivery:** a viewer can request different sizes or regions from an image service through a documented API.

IIIF is a set of interoperability standards, **not** one image format or one viewer.

---

<!-- .slide: class="workflow" -->
## IIIF architecture

**Source image** → **Image server** → **Image API** → **Viewer**

**Presentation API manifest** → tells a viewer how images and associated information form an object

Examples:

- Image server: **Cantaloupe**
- Viewer: **Mirador**

The server supplies image responses; the viewer supplies the user interface.

---

## IIIF Image API

The Image API describes ways to request a specific image representation.

Requests can specify:

- Region (full image or selected area)
- Size
- Rotation
- Quality and format

The server produces an image response for the request.

[Image API 3.0](https://iiif.io/api/image/3.0/)

---

<!-- .slide: class="small" -->
## Anatomy of an Image API URL

```text
{server}/{identifier}/{region}/{size}/{rotation}/{quality}.{format}
```

Illustrative request structure:

```text
.../abc123/full/800,/0/default.jpg
```

- `abc123` identifies the image on the server
- `full` requests the whole image
- `800,` requests width 800 pixels (height proportional)
- `0` requests no rotation
- `default.jpg` specifies default quality, JPEG output

**Note:** this is a structural example, not a live endpoint.

---

## IIIF Presentation API

The Presentation API describes how images are organized and presented as a digital object.

A **manifest** can describe:

- An item (e.g., a manuscript)
- Its ordered canvases/pages
- Associated images and labels
- Metadata and links to related resources

[Presentation API 3.0](https://iiif.io/api/presentation/3.0/)

---

## Image API vs. Presentation API

| Image API | Presentation API |
|---|---|
| How to obtain an image region/size | How to organize and describe an object |
| Returns image representations | Returns structured JSON descriptions |
| Serves zoom and cropping | Supports sequences, labels, metadata |

**Question:** Which API would help a viewer display a ten-page manuscript in order?

---

<!-- .slide: class="small" -->
## IIIF Presentation API: requesting a manifest

**Image API:** Request image pixels, including a chosen region or size.

**Presentation API:** Request a machine-readable description of a digital object.

Example *illustrative* manifest URL (not a live endpoint):

```text
https://example.org/iiif/book1/manifest
```

- Request: `GET` the manifest URL in a browser or application.
- Response: **JSON-LD**, with `type: "Manifest"`.
- Unlike an Image API URL, a manifest URL has **no prescribed region/size/rotation pattern**.

**Question:** What does a viewer need to know besides the pixels in a page image?

---

<!-- .slide: class="small" -->
## Anatomy of a IIIF manifest

```text
Manifest  (digital object: book, manuscript, etc.)
│  label, metadata, ordered canvases
├── Canvas: page 1  (a display surface)
│   └── AnnotationPage
│       └── painting Annotation
│           └── Image resource → optionally Image API service
└── Canvas: page 2
    └── AnnotationPage
        └── painting Annotation
            └── Image resource → optionally Image API service
```

- **Manifest:** organizes the object and its sequence of canvases.
- **Canvas:** the space on which a page's content is displayed.
- **Painting annotation:** associates an image with that canvas.

**Key idea:** The Presentation API describes the object; the Image API supplies image representations.

---

<!-- .slide: class="smaller" -->
## Read a Presentation API response

*Simplified teaching excerpt — not a complete, valid manifest:*

```json
{
  "id": "https://example.org/iiif/book1/manifest",
  "type": "Manifest",
  "label": { "en": ["Book 1"] },
  "items": [{
    "id": "https://example.org/iiif/book1/canvas/p1",
    "type": "Canvas",
    "label": { "none": ["p. 1"] },
    "width": 750, "height": 1000,
    "items": [{
      "type": "AnnotationPage",
      "items": [{
        "type": "Annotation", "motivation": "painting",
        "body": {
          "id": "https://example.org/iiif/book1/page1/full/max/0/default.jpg",
          "type": "Image"
        },
        "target": "https://example.org/iiif/book1/canvas/p1"
      }]
    }]
  }]
}
```

**Find:** (1) object title, (2) page label, (3) image URL.

[Official IIIF Presentation API 3.0 example](https://iiif.io/api/presentation/3.0/#b-example-manifest-response) · [IIIF Cookbook](https://iiif.io/api/cookbook/)

---

## APIs, identifiers, interoperability

- **API:** a documented interface for software to exchange requests and responses
- **Identifier:** a stable reference to a resource or service
- **Persistent identifiers:** designed to remain usable even as systems change
- **Interoperability:** tools and institutions can exchange and reuse content through shared conventions

**Caution:** a URL alone is not guaranteed to remain persistent.

---

## Connect back to enterprise architecture

- Storage retains masters
- Processing creates or serves derivatives
- Metadata systems describe objects
- APIs expose resources in standardized ways
- Viewers present them to users

**Prompt:** Where do IIIF components fit into our Week 8 architecture layers?
