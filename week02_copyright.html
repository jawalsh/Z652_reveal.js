## Learning objectives

By the end of class, you should be able to:

- Distinguish copyrighted, public-domain, and openly licensed works.
- Explain how fair use may apply in libraries and digital scholarship.
- Interpret Creative Commons licenses and standardized rights statements.
- Evaluate whether materials are suitable for a public digital collection.
- Identify a feasible project idea and its principal rights question.

---
<!-- .slide: class="activity" -->
## Opening diagnostic
### <!-- 9:10–9:20 · --> Individual vote + discussion

For each statement, decide: **true, false, or “it depends.”** Be ready to explain why.

1. Anything published before 1930 is in the public domain.
2. If an object is online, I can put it in my digital collection.
3. Fair use is an exception to copyright.
4. CC BY and public domain mean essentially the same thing.

**Do not look anything up yet.** We will revisit these claims.

---
## Why copyright matters

A digital library may implicate several exclusive rights:

- reproducing an object
- distributing copies
- publicly displaying or performing it
- preparing adaptations or derivative works

**Access is not permission:** the ability to view or download an object does not by itself authorize reuse.

Resource: [Copyright Basics](https://www.copyright.gov/circs/circ01.pdf)

---
## Copyright fundamentals

- Copyright protects **original expression fixed in a tangible medium**.
- In the United States, protection is generally **automatic**; registration is not required for copyright to exist.
- Copyright protects expression—not facts, ideas, systems, or methods.
- Owning the physical object does not necessarily mean owning its copyright.
- Copyright duration depends on when and how a work was created and published.

---
## Object, file, and rights

The following may belong to different people or institutions:

1. the physical object
2. the digital reproduction or file
3. copyright in the underlying work
4. descriptive metadata

Before reuse, ask: **What exactly am I reusing, and who controls the relevant rights?**

---
## Public domain

A public-domain work is not protected by copyright and may be used without permission under copyright law.

Works may enter or belong to the public domain because:

- copyright expired;
- required formalities were not met under earlier law;
- the work was never eligible for copyright;
- the rights holder dedicated it to the public domain.

Resources: [Duke Public Domain Day](https://web.law.duke.edu/cspd/publicdomainday/) · [The Public Domain Review](https://publicdomainreview.org/)

---
<!-- .slide: class="activity" -->
## Activity: Public-domain triage
### <!-- 9:40–9:55 ·--> Pairs

Use the [Cornell copyright chart](https://guides.library.cornell.edu/ld.php?content_id=85076027) and [Cornell copyright guide](https://guides.library.cornell.edu/ld.php?content_id=63936868). For each item, form a preliminary conclusion and identify what else you need to know:

1. A book published in the United States in 1885
2. A U.S. photograph first published in 1920
3. A U.S. book first published in 1940
4. A recent, unpublished family photograph

For each, record:

- likely status;
- facts that matter;
- confidence: **high / medium / low**.

---
## Public-domain determination is research

Potentially relevant facts include:

- country of origin
- publication status and date
- author’s identity and death date
- notices, registration, or renewal
- employment or commissioned-work status
- later editions, translations, or added content

**“Old” is evidence—not a complete rights determination.**

---
## Fair use

Section 107 identifies four factors:

1. purpose and character of the use
2. nature of the copyrighted work
3. amount and substantiality used
4. effect on the potential market

Fair use is a **contextual balancing analysis**, not a formula or numerical score.

Resource: [ARL Code of Best Practices](https://www.arl.org/code-of-best-practices-in-fair-use-for-academic-and-research-libraries/)

---
## Fair use in libraries and scholarship

The ARL Code addresses recurring practices such as:

- supporting teaching and learning with access to materials;
- digitizing to preserve at-risk items;
- creating digital collections of archival and special-collections materials;
- making collections computationally searchable;
- reproducing material for exhibits and scholarship.

Best practices describe **reasoned community norms**, not automatic safe harbors.

---
<!-- .slide: class="activity" -->
## Activity: A borderline fair-use case
### <!-- 9:55–10:12 ·--> Whole class

> A university archive digitizes an unpublished twentieth-century photograph collection. It displays medium-resolution images publicly with contextual metadata. No rights holder can readily be located, but some photographers may still be living.

Discuss:

1. What purpose does the use serve?
2. What matters about the nature of the works?
3. Is the amount used reasonable for that purpose?
4. What market harm might exist?
5. What risk-reduction measures would strengthen the case?

**Deliverable:** a provisional conclusion plus the strongest counterargument.

---
## Creative Commons licenses

Creative Commons licenses let a copyright holder grant public permissions in advance.

- **BY** — attribution required
- **SA** — adaptations use the same license
- **NC** — noncommercial uses only
- **ND** — no adaptations may be shared

Examples: CC BY · CC BY-SA · CC BY-NC · CC BY-ND · CC0

Resources: [About CC licenses](https://creativecommons.org/share-your-work/cclicenses/) · [CC License Chooser](https://creativecommons.org/chooser/)

---
## RightsStatements.org

Standardized statements communicate what an institution knows about an object’s copyright or reuse status.

Examples include:

- **In Copyright**
- **In Copyright – Educational Use Permitted**
- **Copyright Not Evaluated**
- **No Known Copyright**
- **No Copyright – United States**

Resources: [RightsStatements.org](https://rightsstatements.org/) · [statement vocabulary](https://rightsstatements.org/page/1.0/?language=en)

---
## License ≠ rights statement

| Creative Commons license | RightsStatements.org statement |
|---|---|
| Granted by a rights holder | Applied by a cultural institution |
| Gives permission in advance | Communicates known rights status |
| Tells users what they may do | May signal uncertainty or restrictions |
| Example: CC BY 4.0 | Example: In Copyright |

Both should be applied at the **item level** when rights vary within a collection.

## Activity: Read the label
### <!-- 10:12–10:25 ·--> Pairs

Choose one CC license and one [RightsStatements.org statement](https://rightsstatements.org/page/1.0/?language=en). Explain each in ordinary language.

For each label, answer:

1. Who applies it?
2. What may a user do without further permission?
3. What obligations or restrictions remain?
4. What does the label **not** tell us?

Be prepared to give a **30-second explanation** of the most important difference.

## Activity: Rights Detective
### <!-- 10:45–11:08 ·--> Small groups

Open your assigned collection and locate **one specific item record**:

- Group 1: [Smithsonian Open Access](https://www.si.edu/openaccess)
- Group 2: [Library of Congress: Free to Use and Reuse](https://www.loc.gov/free-to-use/)
- Group 3: [Digital Public Library of America](https://dp.la/)
- Group 4: [IU Libraries Digital Collections](https://digitalcollections.iu.edu/)

Do not rely only on the collection’s homepage or general reputation. Follow links to the item and any rights/terms pages.

---
<!-- .slide: class="activity" -->
## Rights Detective: Report sheet
### One reporter per group

Record:

1. Item title and type
2. Exact rights statement, license, or rights language
3. Likely status: **public domain / copyrighted / openly licensed / uncertain**
4. Reuse apparently permitted
5. Evidence supporting your conclusion
6. Confidence: **high / medium / low**, and why

**Prepare a two-minute report. Include the item URL.**

---
<!-- .slide: class="activity" -->
## Rights Detective debrief
### <!-- 11:08–11:18 ·--> Two minutes per group

As each group reports, listen for:

- standardized versus locally written language;
- collection-level versus item-level information;
- clear permission versus a statement of status;
- missing information or unresolved risk;
- the difference between **access** and **permission**.

Which interface made responsible reuse easiest? What did it do well?

---
## From rights analysis to project design
### <!-- 11:18–11:22 -->

A feasible semester collection is:

## Interesting + Obtainable + Rights-manageable + Appropriately scoped

> You have evaluated other institutions’ decisions about rights. Now apply the same questions to the collection you are proposing to build.

---
<!-- .slide: class="activity" -->
## Activity: Project brainstorming workshop
### <!-- 11:22–11:40 · --> Groups of three

Each student gets approximately **five minutes**:

1. Pitch your two or three possible collection ideas.
2. Say what digital objects the collection would contain.
3. Identify where those objects would come from.
4. Describe their likely rights status.
5. Ask your peers which idea seems most feasible—and why.

**Take notes while your peers respond.**

---
<!-- .slide: class="activity" -->
## Project feedback prompts
### Use these for every proposal

- Is the topic clear and compelling?
- Are enough appropriate objects available?
- Can the objects be legally and ethically included?
- Is item-level rights research likely to be manageable?
- Can the collection be completed during one semester?
- Is the scope too broad, too narrow, or about right?

**Individual deliverable:** identify your current strongest idea and write one sentence explaining why.

---
<!-- .slide: class="activity" -->
## Whole-class wrap-up
### <!-- 11:40–11:43 -->

Share:

- a promising project idea;

- a scope problem your group helped resolve; or
- a question the class should investigate further.

## Exit ticket
### <!-- 11:43–11:45 ·--> Submit before leaving

1. What is your current leading project idea?
2. Where are you likely to obtain the digital objects?
3. What is the biggest rights or scope question you still need to answer?

## Looking ahead: Metadata

Next week we begin working with metadata—the structured information that makes digital collections discoverable, searchable, and interoperable.

> Copyright determines **what** we can make available; metadata determines **how** users find and understand it.
