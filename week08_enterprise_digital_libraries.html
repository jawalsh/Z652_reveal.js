## The central question

**What changes when a digital collection becomes an institutional service rather than a website?**

Think about:

- one million objects;
- multiple staff editing records;
- decades of stewardship.

---

<!-- .slide: class="activity" -->
## Opening discussion

**What would break—or become difficult—if your CollectionBuilder project grew to one million objects?**

- Capture two or three concrete problems.
- Which are technical?
- Which are organizational?

---

## CollectionBuilder: What do we already have?

- Metadata: structured CSV
- Digital objects: files and referenced media
- Presentation: generated static HTML
- Search/browse: generated site features and browser-side functionality
- Publication: GitHub Pages or another web host

**Strength:** understandable, portable, relatively lightweight.

---

## Static site: simplified architecture

```text
			metadata.csv + digital files + configuration
			                    |
			             site generation
			                    |
			          HTML / JSON / assets
			                    |
			               web host
			                    |
			                 users
```

**Where is the editorial workflow? Where is preservation?**

---

## Enterprise does not mean one product

An enterprise digital library is a **set of coordinated services**.

- Manage objects and descriptive records
- Coordinate people and permissions
- Support discovery and delivery
- Track changes and preservation actions
- Keep services operating over time

---

<!-- .slide: class="" -->
## Enterprise architecture: conceptual map

```text
                 PUBLIC INTERFACE / APIs
                          |
                    SEARCH INDEX
                          ^
                          |
STAFF INGEST -> REPOSITORY / APPLICATION -> METADATA DATABASE
                          |
                    OBJECT STORAGE
                          |
                PRESERVATION SERVICES
```

*Conceptual relationships, not a universal product configuration.*

---

## Distinguish the layers

- **Repository:** manages digital resources, identifiers, relationships, access
- **Database:** stores structured application data
- **Object storage:** holds files and bitstreams
- **Search index:** supports fast retrieval and faceting
- **Interface:** helps people deposit, manage, find, and use objects

**One system may combine several functions.**

---

![Enterprise Digital Libraries infographic](images/enterprise_digital_libraries_v2.png)

## Fedora: repository services

- Manages digital resources and relationships
- Provides persistent resource identification and APIs
- Supports integration with other applications

**Fedora is not, by itself, a polished public digital-collection website.**

[Fedora Repository](https://fedorarepository.org/)

---

## Samvera and Hyrax

- **Samvera:** community and ecosystem for repository applications
- **Hyrax:** application providing deposit, management, and discovery features
- May integrate repository, database, search, and storage services

**Analogy:** Fedora is a repository layer; Hyrax provides more of the user-facing application.

[Samvera](https://samvera.org/) · [Hyrax](https://hyrax.samvera.org/)

---

## PostgreSQL: relational database

- Structured records and relationships
- Transactions and concurrent updates
- Application state, users, and permissions

**Not the same as:** storing image files or building a search index.

[PostgreSQL](https://www.postgresql.org/)

---

## Solr / OpenSearch: search index

- Indexes selected metadata and sometimes full text
- Supports fast search, filters, facets, ranking
- Rebuildable from authoritative sources when designed appropriately

**Why not search the database directly for everything?**

[Solr](https://solr.apache.org/)

---

## Storage and Digital Preservation

- File storage vs. object storage
- Store preservation masters and access copies
- Separate storage from presentation
- Plan redundancy, backup, fixity, and recovery
- Storage alone does **not** equal preservation

**Question:** What does a folder of files fail to tell us?

---

<!-- .slide: class="" -->
## Follow one digital object

```text
			Receive master file + metadata
			              |
			     Validate / assign identifier
			              |
			    Store master and metadata
			              |
			    Generate access derivative
			              |
			     Index descriptive fields
			              |
			     Publish through interface
			              |
			    Monitor, audit, preserve
```

Not every repository uses exactly this sequence.

---

## Ingest: more than uploading

- Verify file identity and integrity
- Validate required metadata
- Assign or register identifiers
- Check rights and access restrictions
- Record provenance and actions

**Connection to last week:** Your MAP supplies rules for metadata validation.

---

## Masters and derivatives

- **Master:** retained high-quality source for stewardship
- **Derivative:** transformed copy for delivery or analysis
- Example: high-resolution TIFF → web JPEG / thumbnail

**Why not deliver the master to every user?**

*We'll study image formats and derivatives next week.*

---

## Preservation is an ongoing workflow

- Fixity checks: has a file changed unexpectedly?
- Replication and recovery: can we recover from failure?
- Format monitoring and migration decisions
- Documentation, staffing, and funding

**A backup is necessary but not a preservation program.**

---

## IIIF and APIs: brief preview

- APIs allow systems to exchange information and services
- IIIF supports interoperable image presentation and delivery
- Repository, delivery service, and viewer can be separate

**We'll return to IIIF in Week 10.**

---

## The institution is part of the architecture

Who is responsible for:

- metadata quality and policy?
- access and rights decisions?
- infrastructure, security, and upgrades?
- preservation planning and funding?

**Technology choices create continuing commitments.**

<!-- .slide: class="" -->
## CollectionBuilder vs. enterprise systems

| Question | CollectionBuilder | Enterprise approach |
|---|---|---|
| Publishing | Generated static site | Dynamic services often involved |
| Editing | Files / CSV / Git workflows | Multi-user management workflows |
| Search | Site-oriented search | Dedicated index often used |
| Preservation | Requires separate planning | May integrate preservation services |
| Operations | Relatively light | Ongoing staffing and infrastructure |

These are patterns, not absolute rules.
