## What is a Digital Library

- National/governmental:
  - [Library of Congress Digital Collections](https://www.loc.gov/collections/)
  - [Gallica (BnF)](https://gallica.bnf.fr/accueil/fr/)
  - [Europeana](https://www.europeana.eu/en)
  - [National Diet Library, Japan](https://www.ndl.go.jp/en/)

- Consortial:
  - [HathiTrust Digital Library](https://hathitrust.org/)
  - [Indiana Digital Library](https://indianadigitallibrary.org)

- Independent nonprofit:
  - [Internet Archive](https://archive.org)

- Academic:
  - [IU Bloomington Digital Collections](https://digitalcollections.iu.edu/catalog?f%5Bcampus_sim%5D%5B%5D=IUB&f%5Bhuman_readable_type_sim%5D%5B%5D=Collection&locale=en&sort=num_works_isi+desc)
  - University of Pennsylvania Libraries, [Collections A to Z](https://digitalcollections.library.upenn.edu/collections)

- Community and grassroots:
  - [Project Gutenberg](https://gutenberg.com)
  - [Digital Comic Museum](https://digitalcomicmuseum.com)

- Historical societies and museums:
  - [Digital Vermont](https://digitalvermont.org)
  - [Cleveland Museum of Art](https://discovernewfields.org/about-our-collections))

- Public libraries / public-facing aggregators:
  - [Digital Public Library of America](https://dp.la)
  - [MCPL Digital](https://www.clevelandart.org/art/collection/search)
